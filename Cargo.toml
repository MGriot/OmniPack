[workspace]
resolver = "2"
members = ["crates/omnipack-geom", "crates/omnipack-core", "crates/omnipack-opt", "crates/omnipack-cli", "app/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
parry3d-f64 = "0.17"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1"
proptest = "1"
omnipack-geom = { path = "crates/omnipack-geom" }
omnipack-core = { path = "crates/omnipack-core" }
omnipack-opt = { path = "crates/omnipack-opt" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
