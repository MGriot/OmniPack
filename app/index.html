<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniPack</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-tab="setup" data-mode="auto">
    <header class="toolbar">
      <div class="brand">OmniPack</div>
      <div class="group">
        <select id="sample" title="Load a sample setup">
          <option value="">Sample…</option>
          <option value="mixed">Mixed truck load</option>
          <option value="shapes">All shapes (20 ft container)</option>
          <option value="br1">Benchmark BR1 (3 box types)</option>
          <option value="br4">Benchmark BR4 (10 box types)</option>
          <option value="br7">Benchmark BR7 (20 box types)</option>
        </select>
        <button id="new">New</button>
        <button id="open">Open…</button>
        <button id="save">Save…</button>
      </div>
      <div class="group">
        <select id="catalog" title="Saved setups"><option value="">Catalog…</option></select>
        <button id="cat-save">Save to catalog</button>
        <button id="cat-delete" title="Delete selected catalog entry">Delete</button>
      </div>
      <div class="group" id="solutions-group">
        <button id="solutions" title="Saved plans, training data and the learned placement">Solutions…</button>
        <button id="api" title="Let other programs (ERP systems such as SAP) send cargo and get the placements back">API…</button>
      </div>
      <div id="mode-switch" class="segmented" title="Auto: the packer places everything. Manual: you place units yourself.">
        <button data-mode="auto" class="active">Auto</button>
        <button data-mode="manual">Manual</button>
      </div>
      <div class="spacer"></div>
      <span id="status" class="status"></span>
      <button id="pack" class="primary">Pack ▶</button>
    </header>

    <main>
      <aside id="editor" class="panel"></aside>
      <div id="editor-resize" title="Drag to resize the panel"></div>

      <section id="stage">
        <canvas id="canvas"></canvas>
        <div id="empty" class="empty">Load a sample or add items, then press <b>Pack</b>.</div>
        <div class="overlay top">
          <div id="container-tabs" class="tabs"></div>
          <label>Colour by
            <select id="color-mode">
              <option value="item">Item</option>
              <option value="stop">Delivery stop</option>
              <option value="load">Load on top / limit</option>
              <option value="margin">Stability margin</option>
              <option value="securing">Transport securing needed</option>
              <option value="impact">Impact heatmap (transport force)</option>
              <option value="floor">Floor pressure / rating</option>
            </select>
          </label>
          <button id="reset-cam" title="Reset camera">⟲</button>
        </div>
        <div id="legend" class="overlay legend"></div>
        <div id="manual-bar" class="overlay manual-bar"></div>
        <div class="overlay bottom timeline">
          <div class="transport">
            <button id="first" title="Empty container (Home)">⏮</button>
            <button id="prev" title="Previous item (←)">◀</button>
            <button id="play" title="Play / pause (Space)">▶</button>
            <button id="next" title="Next item (→)">▶|</button>
            <button id="last" title="All items (End)">⏭</button>
          </div>
          <input id="step" type="range" min="0" max="0" value="0" />
          <div class="step-info">
            <span id="step-label"></span>
            <span id="next-label" class="next"></span>
          </div>
        </div>
      </section>

      <aside id="results" class="panel"></aside>
    </main>
    <nav id="mobile-tabs">
      <button data-tab="setup" class="active">Setup</button>
      <button data-tab="view">3D view</button>
      <button data-tab="results">Results</button>
      <button id="pack-mobile" class="primary">Pack ▶</button>
    </nav>
    <div id="modal" class="modal" hidden>
      <form id="modal-form" class="modal-box">
        <label id="modal-label" for="modal-input"></label>
        <input id="modal-input" type="text" />
        <div id="modal-check-row" hidden>
          <label><input id="modal-check" type="checkbox" /> Use for training</label>
          <p id="modal-check-hint" class="hint"></p>
        </div>
        <div class="actions">
          <button type="button" id="modal-cancel">Cancel</button>
          <button type="submit" class="primary">OK</button>
        </div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
