<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>OmniPack 3D Pro - Advanced Edition</title>
    <script src="vendor/babylon.js"></script>
    <style>
        /* Fluid base size: everything below is sized in em/rem, so this one
           line scales the whole UI (text, padding, buttons, icons) with the
           actual device viewport instead of rendering at a fixed pixel size
           regardless of screen size. Tuned to ~14px on a small phone (~360px)
           up to ~18px on tablets/desktop (~800px+). */
        html { font-size: clamp(14px, 1vw + 10.5px, 18px); }

        body, html { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100%; }
        #ui {
            position: absolute; top: 0.625rem; left: 0.625rem; background: rgba(0,0,0,0.9);
            color: white; padding: 1.25rem; font-family: 'Segoe UI', sans-serif;
            border-radius: 0.75rem; width: 26.25rem; max-width: calc(100vw - 1.25rem); box-sizing: border-box;
            max-height: 95vh; overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10;
        }
        @media (max-width: 480px) {
            #ui { top: 0; left: 0; max-width: 100vw; width: 100%; max-height: 70vh; border-radius: 0; }
            .row { flex-wrap: wrap; }
            .row > div { min-width: 5.5rem; }
        }
        .section { margin-bottom: 0.9375rem; border-bottom: 1px solid #333; padding-bottom: 0.625rem; }
        label { display: block; font-size: 0.8em; margin-bottom: 0.125rem; color: #aaa; }
        input, select {
            width: 100%; padding: 0.375rem; margin-bottom: 0.5rem; background: #222;
            border: 1px solid #444; color: white; border-radius: 0.25rem; box-sizing: border-box; font-size: 0.9em;
        }
        .row { display: flex; gap: 0.3125rem; }
        .row input { flex: 1; }
        button {
            width: 100%; padding: 0.75rem; cursor: pointer; background: #007bff; color: white;
            border: none; border-radius: 0.375rem; font-weight: bold; transition: background 0.2s; font-size: 1rem;
        }
        button:hover { background: #0056b3; }
        button.add { background: #6c757d; padding: 0.3125rem; margin-bottom: 0.625rem; font-size: 0.8em; }
        .item-row { background: #1a1a1a; padding: 0.625rem; margin-bottom: 0.625rem; border-radius: 0.375rem; position: relative; border-left: 4px solid #007bff; }
        .remove-btn {
            position: absolute; right: 0.5rem; top: 0.5rem; color: #ff4d4d; cursor: pointer;
            font-weight: bold; font-size: 1.2em; z-index: 5; background: rgba(0,0,0,0.3);
            width: 1.5rem; height: 1.5rem; display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        .remove-btn:hover { background: rgba(255,255,255,0.1); }
        #stats { margin-top: 0.9375rem; font-size: 0.95em; color: #28a745; line-height: 1.4; white-space: pre-wrap; }

        #stats-panel {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid #28a745;
            padding: 0.625rem;
            border-radius: 0.5rem;
            margin-top: 0.625rem;
            font-size: 0.85em;
            display: none;
        }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 0.25rem; }
        .stat-label { color: #aaa; }
        .stat-value { font-weight: bold; color: #fff; }

        .preview-canvas { width: 100%; height: 5rem; background: #000; border-radius: 0.25rem; margin-top: 0.3125rem; }

        #scenario-selector { margin-top: 0.625rem; display: none; }
        .scenario-card { background: #222; padding: 0.625rem; margin-bottom: 0.3125rem; border-radius: 0.375rem; cursor: pointer; border: 1px solid #444; font-size: 0.85em; }
        .scenario-card.active { border-color: #007bff; background: #002b55; }

        #container-switcher { position: absolute; bottom: 1.25rem; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 0.625rem; border-radius: 1.25rem; color: white; display: none; gap: 0.625rem; align-items: center; font-size: 1rem; }
        .nav-btn { background: #444; border: none; color: white; padding: 0.3125rem 0.9375rem; border-radius: 0.9375rem; cursor: pointer; font-size: 1em; }

        .check-group { display: flex; flex-wrap: wrap; gap: 0.625rem; margin-bottom: 0.5rem; background: #111; padding: 0.3125rem; border-radius: 0.25rem; }
        .check-item { display: flex; align-items: center; gap: 0.25rem; font-size: 0.75em; }
        .check-item input { width: auto; margin: 0; }

        .catalog-item { display: flex; align-items: center; justify-content: space-between; background: #222; margin-bottom: 0.3125rem; padding: 0.625rem; border-radius: 0.375rem; border: 1px solid #444; cursor: pointer; }
        .catalog-item:hover { border-color: #007bff; background: #2a2a2a; }
        .catalog-delete { color: #ff4d4d; font-weight: bold; padding: 0 0.625rem; font-size: 1.2em; z-index: 6; }
        .catalog-delete:hover { color: #ff0000; background: rgba(255,0,0,0.1); border-radius: 0.25rem; }
    </style>
</head>
<body>
    <div id="loading-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#050505; color:#007bff; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; font-family:sans-serif;">
        <h1 style="margin:0;">OmniPack 3D</h1>
        <p id="loading-status">Initializing engine...</p>
    </div>
    <script>
        // Check if Babylon is available
        window.addEventListener('DOMContentLoaded', () => {
            console.log("DOM Loaded, checking engine...");
            setTimeout(() => {
                if (typeof BABYLON === 'undefined') {
                    document.getElementById('loading-status').innerHTML = "<span style='color:red'>Error: Babylon.js could not be loaded.<br>Please check your internet connection.</span>";
                } else {
                    document.getElementById('loading-overlay').style.display = 'none';
                }
            }, 3000);
        });
    </script>

    <div id="ui">
        <h2 style="margin-top:0; color: #007bff;">OmniPack 3D Pro</h2>
        
        <div class="section">
            <label>Master Container (W x H x D)</label>
            <div class="row">
                <input type="number" id="cW" value="100">
                <input type="number" id="cH" value="50">
                <input type="number" id="cD" value="50">
            </div>
            <label>Container Shape</label>
            <select id="cST">
                <option value="BOX">BOX (Parallelepiped)</option>
                <option value="SPHERE">SPHERE (Centered)</option>
                <option value="CYLINDER">CYLINDER</option>
                <option value="TETRAHEDRON">TETRAHEDRON</option>
            </select>
        </div>

        <div class="section">
            <label>Global Feature Toggles</label>
            <div class="check-group">
                <div class="check-item"><input type="checkbox" id="gMixing" checked> <label style="display:inline; color:white">Mixing</label></div>
                <div class="check-item"><input type="checkbox" id="gStrategy" checked> <label style="display:inline; color:white">FIFO/LIFO</label></div>
                <div class="check-item"><input type="checkbox" id="gRotation" checked> <label style="display:inline; color:white">Rotation</label></div>
            </div>
        </div>

        <div class="section">
            <label>Item Catalog</label>
            <div id="items-list">
                <div class="item-row" id="item-0">
                    <span class="remove-btn" onclick="removeItem(0)">×</span>
                    <div class="row" style="align-items: center;">
                        <div style="flex:2"><label>Dimensions (W H D)</label>
                            <div class="row">
                                <input type="number" class="iW" value="30" onchange="updatePreview(0)">
                                <input type="number" class="iH" value="30" onchange="updatePreview(0)">
                                <input type="number" class="iD" value="30" onchange="updatePreview(0)">
                            </div>
                        </div>
                        <div style="flex:1"><label>Color</label><input type="color" class="iColor" value="#3498db" onchange="updatePreview(0)"></div>
                    </div>
                    
                    <div class="row">
                        <div style="flex:1"><label>Shape</label>
                            <select class="iST" onchange="updatePreview(0)">
                                <option value="BOX">BOX</option>
                                <option value="SPHERE">SPHERE</option>
                                <option value="CYLINDER">CYLINDER</option>
                                <option value="TETRAHEDRON">TETRAHEDRON</option>
                            </select>
                        </div>
                        <div style="flex:1"><label>Quantity</label><input type="number" class="iQ" value="5"></div>
                    </div>

                    <div class="row">
                        <div style="flex:1"><label>Weight</label><input type="number" class="iWeight" value="10"></div>
                        <div style="flex:1"><label>Max Top</label><input type="number" class="iMax" value="500"></div>
                        <div style="flex:1"><label>Stop ID</label><input type="number" class="iStop" value="0"></div>
                    </div>

                    <div class="row">
                        <div style="flex:1"><label>Strategy</label>
                            <select class="iStrat">
                                <option value="NONE">Standard</option>
                                <option value="FIFO">FIFO (Back)</option>
                                <option value="LIFO">LIFO (Front)</option>
                            </select>
                        </div>
                        <div style="flex:1; display:flex; align-items:center; gap:5px; margin-top:10px">
                            <input type="checkbox" class="iMix" checked style="width:auto; margin:0">
                            <label style="display:inline; margin:0">Allow Mixing</label>
                        </div>
                    </div>

                    <label style="margin-top:5px">Allowed Rotations</label>
                    <div class="check-group iRots">
                        <div class="check-item"><input type="checkbox" value="0" checked> <span style="font-size:0.8em">WHD</span></div>
                        <div class="check-item"><input type="checkbox" value="1" checked> <span style="font-size:0.8em">HWD</span></div>
                        <div class="check-item"><input type="checkbox" value="2" checked> <span style="font-size:0.8em">HDW</span></div>
                        <div class="check-item"><input type="checkbox" value="3" checked> <span style="font-size:0.8em">DHW</span></div>
                        <div class="check-item"><input type="checkbox" value="4" checked> <span style="font-size:0.8em">DWH</span></div>
                        <div class="check-item"><input type="checkbox" value="5" checked> <span style="font-size:0.8em">WDH</span></div>
                    </div>
                    
                    <canvas class="preview-canvas" id="prev-0"></canvas>
                </div>
            </div>
            <button class="add" onclick="addItem()">+ Add New Item Type</button>
        </div>

        <div class="section">
            <label>Optimization & Filling Strategy</label>
            <div class="row">
                <div style="flex:1"><label>Iterations</label><input type="number" id="iter" value="20"></div>
                <div style="flex:1"><label>Engine</label>
                    <select id="mode">
                        <option value="best_fit">AUTO: Best Fit</option>
                        <option value="level2">Accelerated</option>
                        <option value="mcts">MCTS Logic</option>
                        <option value="genetic">Evolutionary</option>
                        <option value="level1">Standard Legacy</option>
                    </select>
                </div>
            </div>
            
            <label>Filling Bias (Versus)</label>
            <select id="versus">
                <option value="LONGITUDINAL">Longitudinal (Back to Front)</option>
                <option value="LATERAL">Lateral (Side to Side)</option>
                <option value="FLOOR_FIRST">Floor First (Surface Saturation)</option>
                <option value="WALL_BUILDING">Wall Building (Depth/Height)</option>
                <option value="CORNER_FIRST">Corner First (4 Corners)</option>
            </select>

            <label>Priority: <span id="p-val">Stability</span></label>
            <input type="range" id="priority" min="0" max="1" step="0.1" value="1" oninput="updatePriorityLabel(this.value)">
            
            <button onclick="runPacking()">CALCULATE PACKING</button>

            <div id="stats-panel">
                <div class="stat-row"><span class="stat-label">Engine:</span> <span class="stat-value" id="s-engine">-</span></div>
                <div class="stat-row"><span class="stat-label">Bias:</span> <span class="stat-value" id="s-bias">-</span></div>
                <div class="stat-row"><span class="stat-label">Stability Score:</span> <span class="stat-value" id="s-stability">0%</span></div>
                <div class="stat-row"><span class="stat-label">Volume Util:</span> <span class="stat-value" id="s-vol">0%</span></div>
                <div class="stat-row"><span class="stat-label">Weight Util:</span> <span class="stat-value" id="s-weight">0%</span></div>
                <div class="stat-row"><span class="stat-label">Total Load:</span> <span class="stat-value" id="s-load">0kg</span></div>
                <div class="stat-row"><span class="stat-label">Accessibility:</span> <span class="stat-value" id="s-access">0%</span></div>
                <div class="stat-row"><span class="stat-label">Center of Mass:</span> <span class="stat-value" id="s-com">0, 0, 0</span></div>
            </div>
        </div>

        <div class="section">
            <h3 style="margin:0 0 10px 0; color: #28a745; font-size: 1em;">📁 Library & Catalog</h3>
            <label>Configuration Name</label>
            <input type="text" id="catalog-name" placeholder="E.g. Standard Palette A">
            <div class="row">
                <button style="background: #28a745; padding: 8px;" onclick="saveToCatalog(false)">SAVE CONFIG</button>
                <button style="background: #17a2b8; padding: 8px;" onclick="saveToCatalog(true)">SAVE + RESULTS</button>
            </div>
            <div class="row" style="margin-top: 5px;">
                <button style="background: #6c757d; padding: 5px; font-size: 0.8em;" onclick="exportCatalog()">EXPORT ALL</button>
                <button style="background: #6c757d; padding: 5px; font-size: 0.8em;" onclick="document.getElementById('import-file').click()">IMPORT FILE</button>
                <input type="file" id="import-file" style="display:none" accept=".json" onchange="importCatalog(this)">
            </div>
            <div id="catalog-list" style="margin-top:10px; max-height: 200px; overflow-y:auto;">
                <p style="font-size: 0.8em; color: #888;">No saved configurations.</p>
            </div>
        </div>
        
        <div id="scenario-selector">
            <label>Results:</label>
            <div id="scenarios-list"></div>
        </div>
        <div id="stats">Ready.</div>
    </div>

    <div id="container-switcher">
        <button class="nav-btn" onclick="prevContainer()">&lt;</button>
        <span id="container-info"></span>
        <button class="nav-btn" onclick="nextContainer()">&gt;</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        // --- NATIVE BRIDGE INTEGRATION ---
        async function api(path, options = {}) {
            if (window.OmniPackAndroid) {
                // Android: addJavascriptInterface only passes strings, and
                // the call is synchronous (blocks until Python returns).
                const method = options.method || "GET";
                const bodyStr = options.body || "";
                const resultStr = window.OmniPackAndroid.call(path, method, bodyStr);
                const parsed = JSON.parse(resultStr);
                if (!parsed.ok) throw new Error(parsed.error);
                return parsed.data;
            } else {
                // Windows: static assets are served from a virtual host that
                // shadows same-host requests before they reach the native
                // bridge - so API calls go to a second, unmapped virtual
                // host instead. (Also used as-is for the plain FastAPI-
                // server dev workflow, where both paths are relative to the
                // same origin.)
                const base = (location.hostname === "omnipack.local") ? "https://omnipack.api" : "";
                const response = await fetch(base + path, options);
                if (!response.ok) throw new Error("API error: " + response.statusText);
                return await response.json();
            }
        }
        // ---------------------------------

        let itemCounter = 1;
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        let currentScene = null;
        let allSuggestions = [];
        let activeScenarioIdx = 0;
        let activeContainerIdx = 0;
        const previews = {};

        function addItem() {
            const list = document.getElementById("items-list");
            const id = itemCounter++;
            const div = document.createElement("div");
            div.className = "item-row";
            div.id = `item-${id}`;
            div.innerHTML = `
                <span class="remove-btn" onclick="removeItem(${id})">×</span>
                <div class="row" style="align-items: center;">
                    <div style="flex:2"><label>Dimensions (W H D)</label>
                        <div class="row">
                            <input type="number" class="iW" value="20" onchange="updatePreview(${id})">
                            <input type="number" class="iH" value="20" onchange="updatePreview(${id})">
                            <input type="number" class="iD" value="20" onchange="updatePreview(${id})">
                        </div>
                    </div>
                    <div style="flex:1"><label>Color</label><input type="color" class="iColor" value="#e74c3c" onchange="updatePreview(${id})"></div>
                </div>
                <div class="row">
                    <div style="flex:1"><label>Shape</label>
                        <select class="iST" onchange="updatePreview(${id})">
                            <option value="BOX">BOX</option>
                            <option value="SPHERE">SPHERE</option>
                            <option value="CYLINDER">CYLINDER</option>
                            <option value="TETRAHEDRON">TETRAHEDRON</option>
                        </select>
                    </div>
                    <div style="flex:1"><label>Quantity</label><input type="number" class="iQ" value="1"></div>
                </div>
                <div class="row">
                    <div style="flex:1"><label>Weight</label><input type="number" class="iWeight" value="5"></div>
                    <div style="flex:1"><label>Max Top</label><input type="number" class="iMax" value="100"></div>
                    <div style="flex:1"><label>Stop ID</label><input type="number" class="iStop" value="0"></div>
                </div>
                <div class="row">
                    <div style="flex:1"><label>Strategy</label>
                        <select class="iStrat"><option value="NONE">Standard</option><option value="FIFO">FIFO</option><option value="LIFO">LIFO</option></select>
                    </div>
                    <div style="flex:1; display:flex; align-items:center; gap:5px; margin-top:10px">
                        <input type="checkbox" class="iMix" checked style="width:auto; margin:0">
                        <label style="display:inline; margin:0">Allow Mixing</label>
                    </div>
                </div>
                <label style="margin-top:5px">Allowed Rotations</label>
                <div class="check-group iRots">
                    <div class="check-item"><input type="checkbox" value="0" checked> <span style="font-size:0.8em">WHD</span></div>
                    <div class="check-item"><input type="checkbox" value="1" checked> <span style="font-size:0.8em">HWD</span></div>
                    <div class="check-item"><input type="checkbox" value="2" checked> <span style="font-size:0.8em">HDW</span></div>
                    <div class="check-item"><input type="checkbox" value="3" checked> <span style="font-size:0.8em">DHW</span></div>
                    <div class="check-item"><input type="checkbox" value="4" checked> <span style="font-size:0.8em">DWH</span></div>
                    <div class="check-item"><input type="checkbox" value="5" checked> <span style="font-size:0.8em">WDH</span></div>
                </div>
                <canvas class="preview-canvas" id="prev-${id}"></canvas>
            `;
            list.appendChild(div);
            setTimeout(() => initItemPreview(id), 50);
        }

        function removeItem(id) { 
            if (previews[id]) { previews[id].engine.dispose(); delete previews[id]; }
            const el = document.getElementById(`item-${id}`);
            if (el) el.remove();
        }

        function initItemPreview(id) {
            const canv = document.getElementById(`prev-${id}`);
            if (!canv) return;
            const pEngine = new BABYLON.Engine(canv, true);
            const scene = new BABYLON.Scene(pEngine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);
            const cam = new BABYLON.ArcRotateCamera("pcam", -Math.PI/4, Math.PI/3, 4, BABYLON.Vector3.Zero(), scene);
            cam.attachControl(canv, true, false);
            new BABYLON.HemisphericLight("plight", new BABYLON.Vector3(1, 1, 0), scene);
            previews[id] = { engine: pEngine, scene: scene, mesh: null, mat: new BABYLON.StandardMaterial("pmat", scene) };
            pEngine.runRenderLoop(() => scene.render());
            updatePreview(id);
        }

        function updatePreview(id) {
            const p = previews[id];
            if (!p) return;
            const row = document.getElementById(`item-${id}`);
            if (!row) return;
            
            const st = row.querySelector(".iST").value;
            const wEl = row.querySelector(".iW");
            const hEl = row.querySelector(".iH");
            const dEl = row.querySelector(".iD");

            if (st === "SPHERE" || st === "TETRAHEDRON") {
                const max = Math.max(parseFloat(wEl.value), parseFloat(hEl.value), parseFloat(dEl.value));
                wEl.value = hEl.value = dEl.value = max;
            }

            if (p.mesh) p.mesh.dispose();

            const w = parseFloat(wEl.value), h = parseFloat(hEl.value), d = parseFloat(dEl.value);
            const color = row.querySelector(".iColor").value;
            const maxDim = Math.max(w, h, d) || 1;
            
            const scale = 1.5;
            if (st === "SPHERE") {
                p.mesh = BABYLON.MeshBuilder.CreateSphere("p", { diameterX: w/maxDim*scale, diameterY: h/maxDim*scale, diameterZ: d/maxDim*scale }, p.scene);
            } else if (st === "TETRAHEDRON") {
                p.mesh = BABYLON.MeshBuilder.CreatePolyhedron("p", { type: 0, size: (w/maxDim*scale)/2 }, p.scene);
            } else if (st === "CYLINDER") {
                p.mesh = BABYLON.MeshBuilder.CreateCylinder("p", { height: h/maxDim*scale, diameterX: w/maxDim*scale, diameterZ: d/maxDim*scale }, p.scene);
            } else {
                p.mesh = BABYLON.MeshBuilder.CreateBox("p", { width: w/maxDim*scale, height: h/maxDim*scale, depth: d/maxDim*scale }, p.scene);
            }
            
            p.mesh.enableEdgesRendering();
            p.mesh.edgesWidth = 10.0;
            p.mesh.material = p.mat;
            p.mat.diffuseColor = BABYLON.Color3.FromHexString(color);
        }

        const createScene = function (containerData) {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.05, 1);
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 200, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 1, 0), scene);

            if (!containerData || !containerData.dimensions) return scene;
            const { dimensions, items, shape_type: cst } = containerData;
            const bW = dimensions.w, bH = dimensions.h, bD = dimensions.d;
            camera.setTarget(new BABYLON.Vector3(bW/2, bH/2, bD/2));
            camera.radius = Math.max(bW, bH, bD) * 2.2;

            let master;
            if (cst === "SPHERE") {
                master = BABYLON.MeshBuilder.CreateSphere("master", { diameterX: bW, diameterY: bH, diameterZ: bD }, scene);
            } else if (cst === "TETRAHEDRON") {
                master = BABYLON.MeshBuilder.CreatePolyhedron("master", { type: 0, size: bW/2 }, scene);
            } else if (cst === "CYLINDER") {
                master = BABYLON.MeshBuilder.CreateCylinder("master", { height: bH, diameterX: bW, diameterZ: bD }, scene);
            } else {
                master = BABYLON.MeshBuilder.CreateBox("master", { width: bW, height: bH, depth: bD }, scene);
            }
            master.position = new BABYLON.Vector3(bW/2, bH/2, bD/2);
            master.enableEdgesRendering();
            master.edgesWidth = 4.0;
            master.edgesColor = new BABYLON.Color4(1, 1, 1, 1);
            master.material = new BABYLON.StandardMaterial("mmat", scene);
            master.material.wireframe = true; 
            master.material.alpha = 0.2;

            if (items) {
                const itemRows = document.querySelectorAll(".item-row");
                const colorMap = {};
                itemRows.forEach(row => colorMap[row.id] = row.querySelector(".iColor").value);

                items.forEach((item, i) => {
                    const rowIdNum = item.id.split('_')[1];
                    const hexColor = colorMap[`item-${rowIdNum}`] || "#3498db";
                    
                    let mesh;
                    const { w, h, d } = item.dimensions;
                    const st = item.shape_type;
                    
                    if (st === "SPHERE") {
                        mesh = BABYLON.MeshBuilder.CreateSphere(item.id, { diameterX: w, diameterY: h, diameterZ: d }, scene);
                    } else if (st === "CYLINDER") {
                        mesh = BABYLON.MeshBuilder.CreateCylinder(item.id, { height: h, diameterX: w, diameterZ: d }, scene);
                    } else if (st === "TETRAHEDRON") {
                        mesh = BABYLON.MeshBuilder.CreatePolyhedron(item.id, { type: 0, size: w/2 }, scene);
                    } else {
                        mesh = BABYLON.MeshBuilder.CreateBox(item.id, { width: w, height: h, depth: d }, scene);
                    }

                    mesh.position = new BABYLON.Vector3(item.position.x + w/2, item.position.y + h/2, item.position.z + d/2);
                    mesh.enableEdgesRendering(); mesh.edgesWidth = 15.0;
                    mesh.material = new BABYLON.StandardMaterial("mat"+i, scene);
                    mesh.material.diffuseColor = BABYLON.Color3.FromHexString(hexColor);
                });
            }
            return scene;
        };

        async function runPacking() {
            const stats = document.getElementById("stats");
            stats.innerHTML = "Status: 🔵 Optimizing...";
            
            const items = [];
            document.querySelectorAll(".item-row").forEach(row => {
                const rowId = row.id.split('-')[1];
                const allowedRots = [];
                row.querySelectorAll(".iRots input:checked").forEach(cb => allowedRots.push(parseInt(cb.value)));
                const q = parseInt(row.querySelector(".iQ").value);
                for(let i=0; i<q; i++) {
                    items.push({
                        id: `it_${rowId}_${i}`,
                        width: parseFloat(row.querySelector(".iW").value),
                        height: parseFloat(row.querySelector(".iH").value),
                        depth: parseFloat(row.querySelector(".iD").value),
                        weight: parseFloat(row.querySelector(".iWeight").value),
                        max_stack_weight: parseFloat(row.querySelector(".iMax").value),
                        stop_id: parseInt(row.querySelector(".iStop").value),
                        strategy: row.querySelector(".iStrat").value,
                        shape_type: row.querySelector(".iST").value,
                        allow_mixing: row.querySelector(".iMix").checked,
                        allowed_rotations: allowedRots.length > 0 ? allowedRots : null
                    });
                }
            });

            const payload = {
                container: {
                    id: "CustomCont",
                    width: parseFloat(document.getElementById("cW").value),
                    height: parseFloat(document.getElementById("cH").value),
                    depth: parseFloat(document.getElementById("cD").value),
                    shape_type: document.getElementById("cST").value
                },
                items: items,
                mode: document.getElementById("mode").value,
                packing_versus: document.getElementById("versus").value,
                iterations: parseInt(document.getElementById("iter").value),
                stability_factor: parseFloat(document.getElementById("priority").value),
                enable_mixing: document.getElementById("gMixing").checked,
                enable_strategy: document.getElementById("gStrategy").checked,
                enable_rotation: document.getElementById("gRotation").checked
            };

            try {
                const result = await api(`/pack`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                allSuggestions = result.suggestions;
                const list = document.getElementById("scenarios-list");
                list.innerHTML = "";
                if (allSuggestions.length > 0) {
                    allSuggestions.forEach((s, i) => {
                        const card = document.createElement("div");
                        card.className = "scenario-card";
                        card.onclick = () => selectScenario(i);
                        card.innerHTML = `<b>Option ${i+1}: ${s.global_utilization.toFixed(2)}% Space</b>`;
                        list.appendChild(card);
                    });
                    document.getElementById("scenario-selector").style.display = "block";
                    selectScenario(0);
                    stats.innerHTML = `<span style='color:#28a745'><b>Optimization Complete</b></span>`;
                }
            } catch (err) { stats.innerHTML = "<span style='color:red'>Error: API unreachable</span>"; }
        }

        function selectScenario(idx) {
            activeScenarioIdx = idx; activeContainerIdx = 0;
            const cards = document.querySelectorAll('.scenario-card');
            cards.forEach((c, i) => c.className = i === idx ? 'scenario-card active' : 'scenario-card');
            updateView();
        }

        function updateView() {
            if (!allSuggestions[activeScenarioIdx]) return;
            const scenario = allSuggestions[activeScenarioIdx];
            const container = scenario.containers[activeContainerIdx];
            if (currentScene) currentScene.dispose();
            currentScene = createScene(container);
            
            const stats = container.stats;
            if (stats) {
                document.getElementById("s-stability").innerText = stats.stability_score.toFixed(1) + "%";
                document.getElementById("s-vol").innerText = stats.volume_utilization.toFixed(1) + "%";
                document.getElementById("s-weight").innerText = stats.weight_utilization.toFixed(1) + "%";
                document.getElementById("s-load").innerText = stats.total_weight.toFixed(1) + "kg";
                document.getElementById("s-access").innerText = container.accessibility.toFixed(1) + "%";
                document.getElementById("s-com").innerText = `${stats.center_of_mass.x.toFixed(1)}, ${stats.center_of_mass.y.toFixed(1)}, ${stats.center_of_mass.z.toFixed(1)}`;
                const meta = container.metadata || {};
                document.getElementById("s-engine").innerText = (meta.engine_mode || "-").toUpperCase();
                document.getElementById("s-bias").innerText = (meta.filling_bias || "-").replace(/_/g, ' ');
                document.getElementById("stats-panel").style.display = "block";
            }

            document.getElementById("container-info").innerText = `${container.id} (${activeContainerIdx + 1}/${scenario.containers.length})`;
            document.getElementById("container-switcher").style.display = scenario.containers.length > 1 ? "flex" : "none";
            engine.runRenderLoop(() => currentScene.render());
        }

        function nextContainer() { if(!allSuggestions[activeScenarioIdx]) return; const s = allSuggestions[activeScenarioIdx]; activeContainerIdx = (activeContainerIdx + 1) % s.containers.length; updateView(); }
        function prevContainer() { if(!allSuggestions[activeScenarioIdx]) return; const s = allSuggestions[activeScenarioIdx]; activeContainerIdx = (activeContainerIdx - 1 + s.containers.length) % s.containers.length; updateView(); }
        function updatePriorityLabel(val) {
            const label = document.getElementById("p-val");
            const f = parseFloat(val);
            if (f > 0.8) label.innerText = "Stability (Strict Floor)";
            else if (f > 0.4) label.innerText = "Balanced";
            else label.innerText = "Density (Maximum Fill)";
        }

        async function saveToCatalog(includeResults) {
            const name = document.getElementById("catalog-name").value.trim();
            if (!name) { alert("Please enter a name for the configuration."); return; }

            const items = [];
            document.querySelectorAll(".item-row").forEach(row => {
                const rowId = row.id.split('-')[1];
                const allowedRots = [];
                row.querySelectorAll(".iRots input:checked").forEach(cb => allowedRots.push(parseInt(cb.value)));
                items.push({
                    id: `it_${rowId}`, width: parseFloat(row.querySelector(".iW").value),
                    height: parseFloat(row.querySelector(".iH").value), depth: parseFloat(row.querySelector(".iD").value),
                    weight: parseFloat(row.querySelector(".iWeight").value), max_stack_weight: parseFloat(row.querySelector(".iMax").value),
                    stop_id: parseInt(row.querySelector(".iStop").value), strategy: row.querySelector(".iStrat").value,
                    shape_type: row.querySelector(".iST").value, allow_mixing: row.querySelector(".iMix").checked,
                    allowed_rotations: allowedRots, quantity: parseInt(row.querySelector(".iQ").value), color: row.querySelector(".iColor").value
                });
            });

            const entry = {
                name: name,
                container: {
                    id: "CustomCont", width: parseFloat(document.getElementById("cW").value),
                    height: parseFloat(document.getElementById("cH").value), depth: parseFloat(document.getElementById("cD").value),
                    shape_type: document.getElementById("cST").value
                },
                items: items,
                global_toggles: {
                    mixing: document.getElementById("gMixing").checked,
                    strategy: document.getElementById("gStrategy").checked,
                    rotation: document.getElementById("gRotation").checked
                },
                optimizer: {
                    mode: document.getElementById("mode").value, versus: document.getElementById("versus").value,
                    iterations: parseInt(document.getElementById("iter").value), priority: parseFloat(document.getElementById("priority").value)
                }
            };

            if (includeResults && allSuggestions.length > 0) entry.suggestions = allSuggestions;

            try {
                await api(`/catalog`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(entry) });
                alert("Saved to catalog!"); loadCatalog();
            } catch (err) { alert("Error saving to catalog."); }
        }

        async function loadCatalog() {
            const list = document.getElementById("catalog-list");
            try {
                const data = await api(`/catalog`);
                list.innerHTML = "";
                if (data.items && data.items.length > 0) {
                    data.items.forEach(item => {
                        const div = document.createElement("div");
                        div.className = "catalog-item";
                        div.innerHTML = `
                            <span onclick='loadEntry("${item.name}")' style='flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;'>${item.name} ${item.suggestions ? "💾" : ""}</span>
                            <span class="catalog-delete" onclick="deleteEntry(event, '${item.name}')">×</span>
                        `;
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = "<p style='font-size: 0.8em; color: #888;'>No saved configurations.</p>";
                }
            } catch (err) { list.innerHTML = "<p style='font-size: 0.8em; color: red;'>API unreachable</p>"; }
        }

        async function loadEntry(name) {
            try {
                const data = await api(`/catalog`);
                const entry = data.items.find(i => i.name === name);
                if (!entry) return;

                document.getElementById("cW").value = entry.container.width;
                document.getElementById("cH").value = entry.container.height;
                document.getElementById("cD").value = entry.container.depth;
                document.getElementById("cST").value = entry.container.shape_type;

                if (entry.global_toggles) {
                    document.getElementById("gMixing").checked = entry.global_toggles.mixing;
                    document.getElementById("gStrategy").checked = entry.global_toggles.strategy;
                    document.getElementById("gRotation").checked = entry.global_toggles.rotation;
                }

                if (entry.optimizer) {
                    document.getElementById("mode").value = entry.optimizer.mode;
                    document.getElementById("versus").value = entry.optimizer.versus;
                    document.getElementById("iter").value = entry.optimizer.iterations;
                    document.getElementById("priority").value = entry.optimizer.priority;
                    updatePriorityLabel(entry.optimizer.priority);
                }

                const list = document.getElementById("items-list");
                list.innerHTML = "";
                Object.values(previews).forEach(p => p.engine.dispose());
                for (const key in previews) delete previews[key];
                itemCounter = 0;

                for (const it of entry.items) {
                    const id = itemCounter++;
                    const div = document.createElement("div");
                    div.className = "item-row";
                    div.id = `item-${id}`;
                    div.innerHTML = `
                        <span class="remove-btn" onclick="removeItem(${id})">×</span>
                        <div class="row" style="align-items: center;">
                            <div style="flex:2"><label>Dimensions (W H D)</label>
                                <div class="row">
                                    <input type="number" class="iW" value="${it.width}" onchange="updatePreview(${id})">
                                    <input type="number" class="iH" value="${it.height}" onchange="updatePreview(${id})">
                                    <input type="number" class="iD" value="${it.depth}" onchange="updatePreview(${id})">
                                </div>
                            </div>
                            <div style="flex:1"><label>Color</label><input type="color" class="iColor" value="${it.color || "#3498db"}" onchange="updatePreview(${id})"></div>
                        </div>
                        <div class="row">
                            <div style="flex:1"><label>Shape</label>
                                <select class="iST" onchange="updatePreview(${id})">
                                    <option value="BOX" ${it.shape_type === "BOX" ? "selected" : ""}>BOX</option>
                                    <option value="SPHERE" ${it.shape_type === "SPHERE" ? "selected" : ""}>SPHERE</option>
                                    <option value="CYLINDER" ${it.shape_type === "CYLINDER" ? "selected" : ""}>CYLINDER</option>
                                    <option value="TETRAHEDRON" ${it.shape_type === "TETRAHEDRON" ? "selected" : ""}>TETRAHEDRON</option>
                                </select>
                            </div>
                            <div style="flex:1"><label>Quantity</label><input type="number" class="iQ" value="${it.quantity}"></div>
                        </div>
                        <div class="row">
                            <div style="flex:1"><label>Weight</label><input type="number" class="iWeight" value="${it.weight}"></div>
                            <div style="flex:1"><label>Max Top</label><input type="number" class="iMax" value="${it.max_stack_weight}"></div>
                            <div style="flex:1"><label>Stop ID</label><input type="number" class="iStop" value="${it.stop_id}"></div>
                        </div>
                        <div class="row">
                            <div style="flex:1"><label>Strategy</label>
                                <select class="iStrat">
                                    <option value="NONE" ${it.strategy === "NONE" ? "selected" : ""}>Standard</option>
                                    <option value="FIFO" ${it.strategy === "FIFO" ? "selected" : ""}>FIFO</option>
                                    <option value="LIFO" ${it.strategy === "LIFO" ? "selected" : ""}>LIFO</option>
                                </select>
                            </div>
                            <div style="flex:1; display:flex; align-items:center; gap:5px; margin-top:10px">
                                <input type="checkbox" class="iMix" ${it.allow_mixing ? "checked" : ""} style="width:auto; margin:0">
                                <label style="display:inline; margin:0">Allow Mixing</label>
                            </div>
                        </div>
                        <label style="margin-top:5px">Allowed Rotations</label>
                        <div class="check-group iRots">
                            ${[0,1,2,3,4,5].map(r => `
                                <div class="check-item"><input type="checkbox" value="${r}" ${it.allowed_rotations.includes(r) ? "checked" : ""}> <span style="font-size:0.8em">${["WHD","HWD","HDW","DHW","DWH","WDH"][r]}</span></div>
                            `).join('')}
                        </div>
                        <canvas class="preview-canvas" id="prev-${id}"></canvas>
                    `;
                    list.appendChild(div);
                    initItemPreview(id);
                }

                if (entry.suggestions) {
                    allSuggestions = entry.suggestions;
                    const sList = document.getElementById("scenarios-list");
                    sList.innerHTML = "";
                    allSuggestions.forEach((s, i) => {
                        const card = document.createElement("div");
                        card.className = "scenario-card";
                        card.onclick = () => selectScenario(i);
                        card.innerHTML = `<b>Option ${i+1}: ${s.global_utilization.toFixed(2)}% Space (Cached)</b>`;
                        sList.appendChild(card);
                    });
                    document.getElementById("scenario-selector").style.display = "block";
                    selectScenario(0);
                    document.getElementById("stats").innerHTML = "<span style='color:#28a745'><b>Loaded from Library (Cached Results)</b></span>";
                } else {
                    allSuggestions = [];
                    document.getElementById("scenario-selector").style.display = "none";
                    document.getElementById("stats").innerText = "Configuration loaded. Ready to calculate.";
                }
                document.getElementById("catalog-name").value = entry.name;
            } catch (err) { alert("Error loading entry."); }
        }

        async function exportCatalog() {
            try {
                const data = await api(`/catalog`);
                const blob = new Blob([JSON.stringify(data, null, 4)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'omnipack_catalog.json'; a.click();
                URL.revokeObjectURL(url);
            } catch (err) { alert("Error exporting catalog."); }
        }

        function importCatalog(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    const items = data.items || (Array.isArray(data) ? data : [data]);
                    for (const entry of items) {
                        await api(`/catalog`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(entry) });
                    }
                    alert("Import successful!"); loadCatalog();
                } catch (err) { alert("Error importing catalog."); }
            };
            reader.readAsText(file);
        }

        async function deleteEntry(e, name) {
            e.stopPropagation();
            if (!confirm(`Delete "${name}" from library?`)) return;
            try {
                await api(`/catalog/${encodeURIComponent(name)}`, { method: "DELETE" });
                loadCatalog();
            } catch (err) { alert("Error deleting entry."); }
        }

        setTimeout(() => { initItemPreview(0); loadCatalog(); }, 100);
        currentScene = createScene();
        engine.runRenderLoop(() => currentScene.render());
        window.addEventListener("resize", () => { engine.resize(); Object.values(previews).forEach(p => p.engine.resize()); });
    </script>
</body>
</html>
